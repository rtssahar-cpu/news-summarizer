name: Frontend CI

# 必須チェックを常に報告させるため、ワークフローは毎回起動する。
# frontend に変更がなければジョブをスキップする（スキップは必須チェック上「成功」扱い）
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter が PR の変更ファイルを API で取得するため

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'

  frontend:
    # Ruleset の必須チェック名と一致させること
    name: Frontend (lint & build via Docker)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image (lint + build)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: test
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
