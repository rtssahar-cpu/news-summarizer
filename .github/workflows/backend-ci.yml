name: Backend CI

# 必須チェックを常に報告させるため、ワークフローは毎回起動する。
# backend に変更がなければジョブをスキップする（スキップは必須チェック上「成功」扱い）
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter が PR の変更ファイルを API で取得するため

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/deploy-backend.yml'

  backend:
    # Ruleset の必須チェック名と一致させること
    name: Backend (lint & test via Docker)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image (lint + test)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: test
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # 本番イメージ（--no-dev）が実際に起動し /health に応答するかを確認する
  smoke-test:
    name: Backend smoke test (production image)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          load: true
          tags: backend-smoke:ci
          cache-from: type=gha,scope=backend

      - name: Start container
        run: docker run -d --name backend-smoke -p 8000:8000 backend-smoke:ci

      - name: Check /health
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/health did not respond with status ok within 30s"
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs backend-smoke

  # main への push で backend のテストとスモークテストが成功した場合のみデプロイする
  deploy:
    name: Deploy backend
    needs: [backend, smoke-test]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.backend.result == 'success' && needs.smoke-test.result == 'success'
    uses: ./.github/workflows/deploy-backend.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
