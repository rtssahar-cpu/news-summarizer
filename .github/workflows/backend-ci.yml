name: Backend CI

# backend 関連の変更時のみ実行する。main への push 時の完了は deploy-backend.yml の起動トリガーになる
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/deploy-backend.yml"

jobs:
  backend:
    name: Backend (lint & test via Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image (lint + test)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: test
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
