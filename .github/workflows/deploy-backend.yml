name: Deploy Backend

# 再利用ワークフロー。backend-ci.yml から main への push でテスト成功後に呼ばれる
# github コンテキストは呼び出し元（push）のものになるため、github.sha はテスト済みのコミット
on:
  workflow_call:

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend
  HEAD_SHA: ${{ github.sha }} # CI がテストしたコミット
  RESOURCE_GROUP: news-summarizer-rg
  ACA_APP: news-summarizer-backend

jobs:
  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # デプロイを同時に走らせない（実行中のものは中断せず、後続は待機）
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          push: true
          tags: ${{ env.IMAGE }}:${{ env.HEAD_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # 古い CI が後から完了した場合に、本番を古いコミットで上書きしないようにする
      - name: Check commit is still the latest on main
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          latest_sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$latest_sha" = "$HEAD_SHA" ]; then
            echo "is-latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skip deploy: $HEAD_SHA is not the latest on main ($latest_sha)"
            echo "is-latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        if: steps.latest.outputs.is-latest == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        if: steps.latest.outputs.is-latest == 'true'
        # インフラ（作成・シークレット・レプリカ数）は CI の管理外。ここではイメージ更新のみ行う
        run: |
          az containerapp update \
            --name "$ACA_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:$HEAD_SHA"
