services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newssummarizer
      POSTGRES_USER: newssummarizer
      POSTGRES_PASSWORD: newssummarizer
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newssummarizer"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev-deps
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: newssummarizer
      POSTGRES_USER: newssummarizer
      POSTGRES_PASSWORD: newssummarizer
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  pgdata:
