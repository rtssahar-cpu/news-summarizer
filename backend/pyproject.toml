[project]
name = "news-summarizer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
exclude = [".venv"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_tests.py"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
