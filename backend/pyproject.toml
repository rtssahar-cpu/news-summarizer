[project]
name = "news-summarizer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "F",  # pycodestyle / Pyflakes
    "I",       # import の並び順
    "C90",     # 循環的複雑度 (mccabe)
    "PLR",     # 引数・分岐・文の数・マジックナンバー (Pylint)
    "S",       # セキュリティ (flake8-bandit)
    "SIM",     # 冗長な書き方の簡略化 (flake8-simplify)
    "FBT",     # bool の位置引数 (flake8-boolean-trap)
    "B",       # Python 特有の潜在的バグ (flake8-bugbear)
    "UP",      # モダンな文法 (pyupgrade)
    "T20",     # print の消し忘れ (flake8-print)
    "PT",      # pytest のスタイル (flake8-pytest-style)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]                   # pytest の assert と期待値
"app/interface_adapters/controllers/**" = ["FBT"]  # FastAPI のクエリパラメータ

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-args = 5
max-statements = 50
max-returns = 6

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_tests.py"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
